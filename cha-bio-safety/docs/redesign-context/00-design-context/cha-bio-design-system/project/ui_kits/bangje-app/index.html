<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>방재 시스템 — UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    body { background: #111318; }

    /* Mode switcher */
    .mode-bar {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000;
      display: flex; gap: 4px;
      background: var(--surface-raised); border: 1px solid var(--border-default);
      border-radius: 99px; padding: 3px;
    }
    .mode-btn {
      padding: 5px 16px; border-radius: 99px; border: none;
      font-family: var(--font-sans); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .15s;
      color: var(--text-tertiary); background: transparent;
    }
    .mode-btn.active {
      background: var(--accent); color: #fff;
    }

    /* Device frames */
    .phone-frame {
      width: 390px; height: 844px;
      border: 2px solid var(--border-strong);
      border-radius: 40px;
      overflow: hidden;
      background: var(--surface-page);
      display: flex; flex-direction: column;
    }
    .desktop-frame {
      width: 1280px; height: 800px;
      border: 2px solid var(--border-strong);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface-page);
    }
    .frame-container {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      padding-top: 50px;
    }

    /* Theme toggle */
    .theme-toggle {
      position: fixed; top: 12px; right: 16px; z-index: 1000;
      padding: 5px 12px; border-radius: 99px;
      background: var(--surface-raised); border: 1px solid var(--border-default);
      color: var(--text-secondary); font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: var(--font-sans);
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="LucideIcons.jsx"></script>
  <script type="text/babel" src="SharedComponents.jsx"></script>
  <script type="text/babel" src="LoginScreen.jsx"></script>
  <script type="text/babel" src="DashboardMobile.jsx"></script>
  <script type="text/babel" src="DashboardDesktop.jsx"></script>
  <script type="text/babel" src="InspectionMobile.jsx"></script>

  <script type="text/babel">
    const MODES = [
      { key: 'login', label: '로그인' },
      { key: 'mobile', label: '모바일' },
      { key: 'desktop', label: '데스크톱' },
      { key: 'inspect', label: '점검' },
    ];

    function App() {
      const [mode, setMode] = React.useState('mobile');
      const [theme, setTheme] = React.useState('dark');

      const toggleTheme = () => {
        const next = theme === 'dark' ? 'light' : 'dark';
        setTheme(next);
        document.documentElement.setAttribute('data-theme', next);
      };

      const handleNavigate = (target) => {
        if (target === 'dashboard') setMode('mobile');
        else if (target === 'inspection') setMode('inspect');
      };

      const renderContent = () => {
        switch (mode) {
          case 'login':
            return (
              <div className="frame-container">
                <div className="phone-frame">
                  <LoginScreen onLogin={() => setMode('mobile')} />
                </div>
              </div>
            );
          case 'mobile':
            return (
              <div className="frame-container">
                <div className="phone-frame">
                  <DashboardMobile onNavigate={handleNavigate} />
                </div>
              </div>
            );
          case 'desktop':
            return (
              <div className="frame-container" style={{ overflow: 'auto' }}>
                <div className="desktop-frame">
                  <DashboardDesktop onNavigate={handleNavigate} />
                </div>
              </div>
            );
          case 'inspect':
            return (
              <div className="frame-container">
                <div className="phone-frame">
                  <InspectionMobile onNavigate={handleNavigate} />
                </div>
              </div>
            );
          default:
            return null;
        }
      };

      return (
        <>
          {/* Mode bar */}
          <div className="mode-bar">
            {MODES.map(m => (
              <button key={m.key}
                className={`mode-btn ${mode === m.key ? 'active' : ''}`}
                onClick={() => setMode(m.key)}>
                {m.label}
              </button>
            ))}
          </div>

          {/* Theme toggle */}
          <button className="theme-toggle" onClick={toggleTheme}>
            {theme === 'dark' ? '☀️ 라이트' : '🌙 다크'}
          </button>

          {renderContent()}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
