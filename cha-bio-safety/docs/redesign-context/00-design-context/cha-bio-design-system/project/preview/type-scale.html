<!DOCTYPE html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--surface-page); padding: 16px 24px; display: flex; flex-direction: column; gap: 2px; }
  .row {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border-default);
  }
  .row:last-child { border-bottom: none; }
  .meta {
    width: 100px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .meta-class {
    font-size: 12px;
    font-family: var(--font-mono);
    color: var(--accent);
    font-weight: 500;
  }
  .meta-spec {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--text-disabled);
  }
  .sample { color: var(--text-primary); flex: 1; }
</style>
</head><body>
  <div class="row">
    <div class="meta"><span class="meta-class">caption</span><span class="meta-spec">12/1.5/400</span></div>
    <div class="sample text-caption">시간, ID, 가장 작은 메타 텍스트</div>
  </div>
  <div class="row">
    <div class="meta"><span class="meta-class">label</span><span class="meta-spec">13/1.5/400</span></div>
    <div class="sample text-label">입력 라벨, 보조 정보 표시</div>
  </div>
  <div class="row">
    <div class="meta"><span class="meta-class">body-sm</span><span class="meta-spec">14/1.6/400</span></div>
    <div class="sample text-body-sm">데스크톱 표 셀, 보조 본문 텍스트</div>
  </div>
  <div class="row">
    <div class="meta"><span class="meta-class">body</span><span class="meta-spec">16/1.7/400</span></div>
    <div class="sample text-body">기본 본문 — 노안 친화 마지노선 16px</div>
  </div>
  <div class="row">
    <div class="meta"><span class="meta-class">title</span><span class="meta-spec">18/1.4/500</span></div>
    <div class="sample text-title">카드 제목, 섹션 헤더</div>
  </div>
  <div class="row">
    <div class="meta"><span class="meta-class">heading</span><span class="meta-spec">22/1.3/600</span></div>
    <div class="sample text-heading">페이지 제목, 모달 제목</div>
  </div>
  <div class="row">
    <div class="meta"><span class="meta-class">display</span><span class="meta-spec">28/1.0/500</span></div>
    <div class="sample text-display">통계 숫자 강조</div>
  </div>
</body></html>
