<!DOCTYPE html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--surface-page); padding: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tool-card {
    background: var(--surface-raised);
    border: 1px solid var(--border-default);
    border-radius: 14px;
    padding: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    text-align: center; cursor: pointer;
  }
  .tool-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .tool-icon svg { width: 24px; height: 24px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tool-label { font-size: 13px; font-weight: 700; color: var(--text-primary); }
  .tool-desc { font-size: 12px; color: var(--text-tertiary); line-height: 1.3; }
</style>
</head><body>
  <div class="tool-card">
    <div class="tool-icon" style="background: rgba(59,130,246,.1);"><svg viewBox="0 0 24 24" stroke="#3b82f6"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg></div>
    <div><div class="tool-label">도면 점검</div><div class="tool-desc">층별 도면 · 유도등 · 감지기</div></div>
  </div>
  <div class="tool-card">
    <div class="tool-icon" style="background: rgba(14,165,233,.1);"><svg viewBox="0 0 24 24" stroke="#0ea5e9"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></div>
    <div><div class="tool-label">DIV 트렌드</div><div class="tool-desc">측정점 압력 트렌드 차트</div></div>
  </div>
  <div class="tool-card">
    <div class="tool-icon" style="background: rgba(239,68,68,.1);"><svg viewBox="0 0 24 24" stroke="#ef4444"><path d="M7 18v-6a5 5 0 1 1 10 0v6"/><path d="M5 21a1 1 0 0 1-1-1v-1a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1z"/><path d="M21 12h1"/><path d="M18.5 4.5 18 5"/><path d="M2 12h1"/><path d="M12 2v1"/><path d="M4.929 4.929l.707.707"/></svg></div>
    <div><div class="tool-label">고장 접수</div><div class="tool-desc">승강기 고장 접수 · TKE 연결</div></div>
  </div>
  <div class="tool-card">
    <div class="tool-icon" style="background: rgba(34,197,94,.1);"><svg viewBox="0 0 24 24" stroke="#22c55e"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
    <div><div class="tool-label">직원 서비스</div><div class="tool-desc">연차 · 식사 · 근무표 통합</div></div>
  </div>
</body></html>
