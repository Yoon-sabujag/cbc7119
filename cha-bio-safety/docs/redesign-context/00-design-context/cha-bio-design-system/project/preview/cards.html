<!DOCTYPE html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--surface-page); padding: 16px; display: flex; gap: 12px; }
  .card {
    background: var(--surface-raised);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    padding: var(--card-padding);
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: var(--card-gap);
  }
</style>
</head><body>
  <!-- Standard card -->
  <div class="card">
    <div class="text-title" style="color: var(--text-primary);">DIV 압력 측정</div>
    <div class="text-label" style="color: var(--text-secondary);">B5층 · 박보융 · 4시간 전</div>
    <div style="display: flex; gap: 6px;">
      <span style="font-size:12px;font-weight:600;padding:3px 12px;border-radius:99px;background:var(--status-safe-bg);color:var(--status-safe);">정상</span>
    </div>
  </div>

  <!-- Stat card -->
  <div class="card" style="position: relative; overflow: hidden;">
    <div class="text-label" style="color: var(--text-tertiary);">점검 미완료</div>
    <div style="display: flex; align-items: baseline; gap: 4px;">
      <span style="font-family: var(--font-mono); font-size: 28px; font-weight: 700; line-height: 1; color: var(--status-danger);">12</span>
      <span class="text-body-sm" style="color: var(--text-tertiary);">/34</span>
    </div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--status-danger);border-radius:0 0 12px 12px;"></div>
  </div>

  <!-- Banner card -->
  <div style="flex:1.3;background:linear-gradient(135deg,rgba(37,99,235,.10),rgba(14,165,233,.05));border:1px solid rgba(59,130,246,.15);border-radius:var(--radius-lg);padding:14px 18px;display:flex;align-items:center;gap:12px;">
    <div style="width:8px;height:8px;border-radius:50%;background:var(--status-info);flex-shrink:0;"></div>
    <div>
      <div style="font-size:12px;font-weight:700;color:var(--status-info);letter-spacing:.04em;">오늘 점검 대상</div>
      <div class="text-body-sm" style="font-weight:700;color:var(--text-primary);margin-top:3px;">전 층 DIV 격주 점검 · B5~8층 34개 측정점</div>
    </div>
  </div>
</body></html>
