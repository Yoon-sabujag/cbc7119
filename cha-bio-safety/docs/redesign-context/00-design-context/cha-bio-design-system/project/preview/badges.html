<!DOCTYPE html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--surface-page); padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .label { font-size: 12px; color: var(--text-tertiary); width: 90px; flex-shrink: 0; }
  .badge { display: inline-flex; align-items: center; padding: 3px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
  .duty-chip { padding: 3px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; }
  svg.ico { width: 14px; height: 14px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }
</style>
</head><body>
  <div class="row">
    <span class="label">Status badges</span>
    <span class="badge" style="background: var(--status-safe-bg); color: var(--status-safe);">정상</span>
    <span class="badge" style="background: var(--status-warning-bg); color: var(--status-warning);">주의</span>
    <span class="badge" style="background: var(--status-danger-bg); color: var(--status-danger);">불량</span>
    <span class="badge" style="background: var(--status-fire-bg); color: var(--status-fire);">미조치</span>
    <span class="badge" style="background: var(--status-info-bg); color: var(--status-info);">진행중</span>
    <span class="badge" style="background: rgba(110,118,129,.13); color: var(--text-tertiary);">미확인</span>
  </div>
  <div class="row">
    <span class="label">Result picker</span>
    <span class="chip" style="background: var(--status-safe-bg); color: var(--status-safe); border: 1.5px solid var(--status-safe);">
      <svg class="ico" viewBox="0 0 24 24" stroke="var(--status-safe)"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg> 정상
    </span>
    <span class="chip" style="background: var(--status-warning-bg); color: var(--status-warning); border: 1.5px solid var(--status-warning);">
      <svg class="ico" viewBox="0 0 24 24" stroke="var(--status-warning)"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> 주의
    </span>
    <span class="chip" style="background: var(--status-danger-bg); color: var(--status-danger); border: 1.5px solid var(--status-danger);">
      <svg class="ico" viewBox="0 0 24 24" stroke="var(--status-danger)"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg> 불량
    </span>
  </div>
  <div class="row">
    <span class="label">Duty chips</span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:99px;background:rgba(245,158,11,.15);">
      <span style="width:26px;height:26px;border-radius:50%;background:var(--duty-day);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;">석</span>
      <span style="display:flex;flex-direction:column;line-height:1.2;"><span style="font-size:12px;font-weight:700;color:var(--text-primary);">석현민</span><span style="font-size:10px;color:var(--text-tertiary);">주간</span></span>
    </span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:99px;background:rgba(59,130,246,.15);">
      <span style="width:26px;height:26px;border-radius:50%;background:var(--duty-off);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;">김</span>
      <span style="display:flex;flex-direction:column;line-height:1.2;"><span style="font-size:12px;font-weight:700;color:var(--text-primary);">김병조</span><span style="font-size:10px;color:var(--text-tertiary);">비번</span></span>
    </span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:99px;background:rgba(239,68,68,.15);">
      <span style="width:26px;height:26px;border-radius:50%;background:var(--duty-night);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;">윤</span>
      <span style="display:flex;flex-direction:column;line-height:1.2;"><span style="font-size:12px;font-weight:700;color:var(--text-primary);">윤종엽</span><span style="font-size:10px;color:var(--text-tertiary);">당직</span></span>
    </span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:99px;background:rgba(107,114,128,.15);">
      <span style="width:26px;height:26px;border-radius:50%;background:var(--duty-leave);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;">박</span>
      <span style="display:flex;flex-direction:column;line-height:1.2;"><span style="font-size:12px;font-weight:700;color:var(--text-primary);">박보융</span><span style="font-size:10px;color:var(--text-tertiary);">휴무</span></span>
    </span>
  </div>
  <div class="row">
    <span class="label">Count badge</span>
    <span style="font-size: 12px; color: var(--text-tertiary); background: var(--surface-sunken); padding: 2px 10px; border-radius: 10px;">5건</span>
    <span style="font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--status-safe); background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.18); padding: 4px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px;">
      <svg class="ico" viewBox="0 0 24 24" stroke="var(--status-safe)"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      연속 14일 점검 달성
    </span>
  </div>
</body></html>
