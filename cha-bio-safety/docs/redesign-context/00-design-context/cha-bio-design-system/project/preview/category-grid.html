<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--surface-page); padding: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
  .cat-card {
    background: var(--surface-raised);
    border: 1px solid var(--border-default);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    width: calc(50% - 5px);
  }
  .cat-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .cat-icon svg { width: 20px; height: 20px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cat-label { font-size: 13px; font-weight: 700; color: var(--text-primary); }
  .cat-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 1px; }
</style>
