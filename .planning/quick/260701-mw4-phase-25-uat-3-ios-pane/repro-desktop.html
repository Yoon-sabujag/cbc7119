<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<style>
  :root{--surface-page:#0a0d12;--surface-raised:#1a1f27;--surface-sunken:#232a33;--text-primary:#e6edf3;--text-secondary:#adb6c0;--text-tertiary:#8b949e;--border-default:rgba(255,255,255,.14);--danger:#f87171;--fire:#fb923c;--safe-bar:#22c55e;--danger-bar:#ef4444;--fire-bar:#f97316;--info-bar:#0ea5e9;--accent:#3b82f6;--info:#38bdf8;--safe:#4ade80;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
  body{background:#05070a;color:var(--text-primary);}
  .app{width:1920px;height:1080px;display:flex;flex-direction:column;}
  .ghead{flex:0 0 auto;height:48px;background:var(--surface-raised);border-bottom:1px solid var(--border-default);display:flex;align-items:center;padding:0 24px;font-weight:700;}
  /* dashboard container: w-full h-full overflow-auto px-7 py-5 flex flex-col gap-4 */
  .dash{flex:1 1 auto;min-height:0;overflow:auto;padding:20px 32px;display:flex;flex-direction:column;gap:16px;}
  .row0{display:flex;align-items:center;justify-content:space-between;}
  .row0 .chips{display:flex;gap:8px;font-size:12px;color:var(--text-secondary);}
  .banner{border-radius:16px;border:1px solid rgba(14,165,233,.3);padding:16px 24px;background:linear-gradient(135deg,rgba(37,99,235,.10),rgba(14,165,233,.05));}
  .banner .k{font-size:12px;font-weight:700;color:var(--info-bar);text-transform:uppercase;}
  .banner .v{font-size:14px;font-weight:700;margin-top:4px;}
  .row2{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .sc{background:var(--surface-raised);border:1px solid var(--border-default);border-radius:16px;padding:20px;position:relative;overflow:hidden;}
  .sc .l{font-size:12px;color:var(--text-tertiary);margin-bottom:10px;}
  .sc .n{font-family:monospace;font-size:36px;font-weight:700;line-height:1;}
  .sc .bar{position:absolute;bottom:0;left:0;right:0;height:3px;}
  /* Row3 */
  .row3{display:flex;gap:16px;flex:1;min-height:0;}
  .left{flex:1;display:flex;flex-direction:column;gap:16px;}
  .right{width:340px;flex:0 0 auto;display:flex;flex-direction:column;gap:16px;}
  .card{background:var(--surface-raised);border:1px solid var(--border-default);border-radius:16px;overflow:hidden;}
  .insp{display:flex;flex-direction:column;flex:1;}
  .insp .h{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border-default);}
  .insp .h .t{font-size:14px;font-weight:700;} .insp .h .r{font-size:13px;color:var(--text-tertiary);}
  .insp .body{padding:20px 24px;display:flex;flex-direction:column;gap:32px;flex:1;justify-content:center;overflow-y:auto;}
  .drow{display:flex;justify-content:space-evenly;gap:8px;}
  .du{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
  .donut{width:76px;height:76px;border-radius:50%;border:6px solid var(--safe-bar);display:flex;align-items:center;justify-content:center;font-size:15px;font-family:monospace;font-weight:700;}
  .donut.z{border-color:var(--surface-sunken);}
  .du .lbl{font-size:12px;color:var(--text-secondary);}
  .du .frac{font-size:12px;font-family:monospace;color:var(--text-tertiary);}
  .qtools{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:0 0 auto;}
  .qt{background:var(--surface-raised);border:1px solid var(--border-default);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
  .qt .ic{width:44px;height:44px;border-radius:12px;background:var(--surface-sunken);}
  .qt .tl{font-size:13px;font-weight:700;} .qt .td{font-size:12px;color:var(--text-tertiary);margin-top:2px;}
  /* ===== RIGHT column: FIX-3 approach a (current deployed) ===== */
  .topgroup{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;}
  .live{overflow:hidden;flex:0 0 auto;}
  .live .h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border-default);font-size:13px;font-weight:700;}
  .live .h .r{margin-left:auto;font-size:12px;color:var(--text-tertiary);font-weight:400;}
  .live .vid{background:#000;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#4b5563;font-size:12px;position:relative;}
  .live .cap{padding:9px 13px;font-size:13px;font-weight:700;color:var(--safe);}
  .cal{flex:0 0 auto;padding:16px 14px;margin-top:auto;}  /* mt-auto */
  .cal .ct{text-align:center;font-size:13px;font-weight:700;margin-bottom:10px;}
  .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
  .cg .dow{font-size:12px;font-weight:700;color:var(--text-tertiary);padding:2px 0;}
  .cg .c{font-size:12px;padding:3px 0;}
  .cg .c .d{width:28px;height:28px;line-height:28px;border-radius:50%;margin:0 auto;}
  .cg .c.today .d{background:var(--accent);color:#fff;}
  .today{flex:0 0 auto;height:125px;overflow:hidden;display:flex;flex-direction:column;}
  .today .h{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border-default);font-size:13px;font-weight:700;}
  .today .h .r{font-size:12px;color:var(--text-tertiary);font-weight:400;}
  .today .li{padding:8px 16px;font-size:13px;color:var(--text-secondary);border-bottom:1px solid var(--border-default);}
  /* alignment guides */
  .g{position:absolute;left:0;right:0;border-top:2px dashed #fde047;z-index:9;pointer-events:none;}
</style></head><body>
<div class="app">
  <div class="ghead">대시보드</div>
  <div class="dash">
    <div class="row0"><div class="chips">관리자 석현민 · 보조 김병조·박보윤·윤종엽</div><div class="chips">연속 50일 점검 달성</div></div>
    <div class="banner"><div class="k">오늘 점검 대상</div><div class="v">전층 피난계단 점검</div></div>
    <div class="row2">
      <div class="sc"><div class="l">점검 미완료</div><div class="n">0</div><div class="bar" style="background:var(--danger-bar)"></div></div>
      <div class="sc"><div class="l">미조치 항목</div><div class="n" style="color:var(--fire)">2</div><div class="bar" style="background:var(--fire-bar)"></div></div>
      <div class="sc"><div class="l">오늘 일정</div><div class="n">2</div><div class="bar" style="background:var(--border-default)"></div></div>
      <div class="sc"><div class="l">승강기 고장</div><div class="n">0</div><div class="bar" style="background:var(--safe-bar)"></div></div>
    </div>
    <div class="row3">
      <div class="left">
        <div class="card insp">
          <div class="h"><span class="t">이번 달 점검 현황</span><span class="r">2026년 7월</span></div>
          <div class="body">
            <div class="drow" id="dr1"></div>
            <div class="drow" id="dr2"></div>
          </div>
        </div>
        <div class="qtools" id="qt"></div>
      </div>
      <div class="right">
        <div class="topgroup">
          <div class="card live">
            <div class="h">🔔 화재수신반 라이브 <span class="r">방재실 캡처</span></div>
            <div class="vid">수신반 화면 로딩 · 미연결</div>
            <div class="cap">● 정상 · 이상 없음 · 지연</div>
          </div>
          <div class="card cal">
            <div class="ct">2026년 7월</div>
            <div class="cg" id="cg"></div>
          </div>
        </div>
        <div class="card today">
          <div class="h">오늘 일정 <span class="r">2건</span></div>
          <div class="li">— 전층 피난계단 점검 · 완료</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const labels1=[['방화문','50/50'],['특별피난계단','50/50'],['연결송수관','0/2'],['전실제연댐퍼','0/16'],['청정소화약제','0/5'],['컴프레셔','0/68']];
  const labels2=[['DIV','0/68'],['유도등','0/674'],['배연창','0/16'],['완강기','0/13'],['주차장비','0/1'],['회전문','0/2']];
  const mk=(arr)=>arr.map(([l,f],i)=>`<div class="du"><div class="donut ${i>1?'z':''}">${i>1?'0%':'100%'}</div><div class="lbl">${l}</div><div class="frac">${f}</div></div>`).join('');
  document.getElementById('dr1').innerHTML=mk(labels1);
  document.getElementById('dr2').innerHTML=mk(labels2);
  const tools=[['도면 점검','층별 도면·유도등·감지기'],['DIV 트렌드','측정점 압력 트렌드 차트'],['고장 접수','승강기 고장 접수·TKE 연결'],['직원 서비스','연차·식사·근무표 통합']];
  document.getElementById('qt').innerHTML=tools.map(([t,d])=>`<div class="qt"><div class="ic"></div><div class="tl">${t}</div><div class="td">${d}</div></div>`).join('');
  let cg='';['일','월','화','수','목','금','토'].forEach(d=>cg+=`<div class="dow">${d}</div>`);
  for(let i=0;i<3;i++)cg+='<div class="c"></div>';
  for(let d=1;d<=31;d++)cg+=`<div class="c ${d===1?'today':''}"><div class="d">${d}</div></div>`;
  document.getElementById('cg').innerHTML=cg;
</script>
</body></html>
